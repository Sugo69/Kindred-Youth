                                className="px-3 py-1 border border-amber-600 text-amber-400 text-xs rounded-lg hover:bg-amber-900/30 uppercase"
                                style={{fontFamily:'Orbitron,sans-serif'}}>🔁 Switch Lesson</button>
                            <button onClick={()=>setGameState('portal')}
                                className="px-3 py-1 border border-slate-600 text-slate-400 text-xs rounded-lg hover:bg-slate-800 uppercase"
                                style={{fontFamily:'Orbitron,sans-serif'}}>← Portal</button>
                        </div>
                    )}

                    {/* Scaled stage — only the card grid scales */}
                    <div style={{ flex:1, minHeight:0, overflow:'hidden', transform:`scale(${scale/100})`, transformOrigin:'top center' }}>
                    <main className={`p-3 ${isSabotaging ? 'animate-error-shake' : ''}`} style={{width:'100%',height:'100%'}}>
                        <div className={`grid gap-2 w-full h-full transition-all duration-500`}
                            style={{ gridTemplateColumns: `repeat(${cols}, 1fr)`, gridAutoRows: '1fr' }}>
                            {cards.map((card, idx) => {
                                const isFlipped = flipped.includes(idx);
                                const isMatched = matched.includes(card.pairId);
                                const isMismatch = mismatchIdx.includes(idx);
                                const isFaceA = card.face === 'A';
                                return (
                                    <div key={card.uniqueId}
                                        className={`relative perspective-1000 cursor-pointer ${isMismatch ? 'animate-error-shake' : ''}`}
                                        onClick={() => handleCardClick(idx)}>
                                        <div className={`w-full h-full transform-style-3d transition-transform duration-500 ${isFlipped || isMatched ? 'rotate-y-180' : ''}`}>
                                            {/* Back */}
                                            <div className={`absolute inset-0 backface-hidden rounded-xl border-2 flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900
                                                ${isMismatch ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]' : 'border-cyan-500/30 hover:border-cyan-400 hover:shadow-[0_0_15px_rgba(0,242,255,0.3)]'}`}>
                                                <span className="text-3xl md:text-5xl font-black text-cyan-500/20 select-none">?</span>
                                            </div>
                                            {/* Front */}
                                            <div className={`absolute inset-0 backface-hidden rotate-y-180 flex flex-col items-center justify-center text-center border-2 transition-all
                                                ${isPrimary ? 'rounded-3xl p-3' : 'rounded-xl p-2'}
                                                ${isMatched
                                                    ? (isPrimary
                                                        // Matched cards stay LIT in Primary mode — they are the record
                                                        // of what the class has found, not spent tiles.
                                                        ? 'bg-gradient-to-br from-emerald-800/70 to-slate-900 border-amber-400 shadow-[0_0_25px_rgba(251,191,36,0.45)]'
                                                        : 'bg-slate-900/60 border-slate-700 opacity-40 hover:opacity-90 hover:border-orange-400 hover:shadow-[0_0_15px_rgba(249,115,22,0.35)]')
                                                    : isFaceA
                                                        ? 'bg-gradient-to-br from-cyan-900/60 to-slate-900 border-cyan-400 shadow-[0_0_20px_rgba(0,242,255,0.3)]'
                                                        : 'bg-gradient-to-br from-purple-900/60 to-slate-900 border-purple-400 shadow-[0_0_20px_rgba(157,0,255,0.3)]'}`}>
                                                {isPrimary ? (
                                                    <>
                                                        {/* The emoji is the match key — text is additive, never required,
                                                            so a pre-reader is never blocked and an older child still
                                                            gets a second cue on the back face. */}
                                                        <span style={{fontSize:'clamp(3.5rem,11vw,7rem)', lineHeight:1, marginBottom:'0.1em'}}>{card.icon}</span>
                                                        <div className={isFaceA ? 'text-cyan-100' : 'text-purple-100'}
                                                            style={{fontFamily:'Rajdhani,sans-serif', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', lineHeight:1.1,
                                                                    fontSize: isFaceA ? 'clamp(1.1rem,2.6vw,1.8rem)' : 'clamp(0.8rem,1.7vw,1.15rem)'}}>
                                                            {isFaceA ? card.word : card.phrase}
                                                        </div>
                                                    </>
                                                ) : (
                                                    <>
                                                        <span style={{fontSize:'clamp(2rem,4vw,3.5rem)', lineHeight:1, marginBottom:'0.35em'}}>{card.icon}</span>
                                                        <div className={`font-bold leading-tight px-1 text-center ${isFaceA ? 'text-cyan-300' : 'text-purple-300'}`}
                                                            style={{fontFamily: isFaceA ? 'Orbitron,sans-serif' : 'Rajdhani,sans-serif', fontSize:'clamp(0.45rem,1.1vw,0.7rem)'}}>
                                                            {isFaceA ? card.cardA : card.cardB}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                    </div>{/* end scaled stage */}

                    {/* ── Story Card (Primary) — the match modal, cut to four blocks.
                           Plain-language meaning first, then the verbatim fragment in
                           quotes with its reference. The paraphrase NEVER gets quotes
                           or a ref: a paraphrase shown as scripture is a misquotation. ── */}
                    {activeCard && isPrimary && (
                        <div style={{position:'fixed',top:overlayTop,left:0,right:0,bottom:0,zIndex:50,background:'rgba(2,6,23,0.97)',display:'flex',alignItems:'stretch',justifyContent:'center',padding:'0.5rem'}}>
                            <div style={{width:'100%',maxWidth:'1800px',display:'flex',flexDirection:'column',border:'3px solid #fbbf24',borderRadius:'1.5rem',background:'#0b0f1a',overflow:'hidden',boxShadow:'0 0 60px rgba(251,191,36,0.25)'}}>

                                <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>
                                    {/* Giant picture */}
                                    <div style={{width:'34%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'0.5rem',background:'radial-gradient(ellipse at center,#132018,#05040a)',borderRight:'1px solid rgba(251,191,36,0.2)'}}>
                                        <span style={{fontSize:'clamp(6rem,16vw,13rem)',lineHeight:1,filter:'drop-shadow(0 0 50px rgba(251,191,36,0.3))'}}>{activeCard.icon}</span>
                                        <div style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em',color:'#fde68a',fontSize:'clamp(1.5rem,3.4vw,2.6rem)'}}>
                                            {activeCard.word}
                                        </div>
                                    </div>

                                    <div id="story-scroll" style={{flex:1,display:'flex',flexDirection:'column',padding:'1.5rem 2rem',overflowY:'auto',justifyContent:'flex-start',gap:'0.9rem',overflowAnchor:'none'}}>
                                        {/* ── ONE scripture block ──
                                               The plain-language meaning is the big line (a six-year-old
                                               reads/hears this), the verbatim fragment sits directly under
                                               it, and the Christ connection closes the same block. The
                                               separate "what happens" line was cut: it restated the
                                               meaning line almost word for word.

                                               The paraphrase still gets NO quotes and NO reference —
                                               only the verbatim text does. Adjacent, never confusable. ── */}
                                        <div style={{borderLeft:'4px solid #22d3ee',paddingLeft:'1.1rem',display:'flex',flexDirection:'column',gap:'0.6rem'}}>
                                            {activeCard.verseSimple && (
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#f1f5f9',lineHeight:1.3,fontSize:'clamp(1.5rem,3.1vw,2.6rem)',margin:0}}>
                                                    {activeCard.verseSimple}
                                                </p>
                                            )}
                                            {activeCard.versePhrase && (
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontStyle:'italic',color:'#94a3b8',lineHeight:1.4,fontSize:'clamp(1rem,1.8vw,1.35rem)',margin:0}}>
                                                    “{activeCard.versePhrase}” <span style={{color:'#64748b',fontStyle:'normal'}}>— {activeCard.verseRef}</span>
                                                </p>
                                            )}
                                            {activeCard.christConnection && (
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#fcd34d',lineHeight:1.35,fontSize:'clamp(1.1rem,2.1vw,1.6rem)',margin:0}}>
                                                    {activeCard.christConnection}
                                                </p>
                                            )}
                                        </div>

                                        {/* One thing the class DOES together */}
                                        {activeCard.prompt && (
                                            <div style={{background:'rgba(34,197,94,0.1)',border:'1px solid rgba(34,197,94,0.35)',borderRadius:'0.75rem',padding:'0.85rem 1rem',display:'flex',gap:'0.75rem',alignItems:'flex-start'}}>
                                                <span style={{fontSize:'1.6rem',lineHeight:1,flexShrink:0}}>👉</span>
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#dcfce7',lineHeight:1.35,fontSize:'clamp(1.2rem,2.3vw,1.8rem)',margin:0}}>
                                                    {activeCard.prompt}
                                                </p>
                                            </div>
                                        )}

                                        {/* Teacher-facing QR, small and out of the way */}
                                        {activeCard.url && (
                                            <div style={{display:'flex',alignItems:'center',gap:'0.6rem'}}>
                                                <a href={buildHighlightUrl(activeCard.url, activeCard.verseRef || '')} target="_blank" rel="noopener noreferrer" style={{display:'block',lineHeight:0}}>
                                                    <canvas id="qr-canvas" style={{borderRadius:'0.4rem',border:'1px solid #374151',cursor:'pointer',width:'58px',height:'58px'}} />
                                                </a>
                                                <span style={{fontFamily:'Rajdhani,sans-serif',fontSize:'0.75rem',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.1em'}}>Scan to read the verse</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div style={{borderTop:'1px solid rgba(251,191,36,0.25)',background:'rgba(0,0,0,0.4)',padding:'1rem 1.5rem'}}>
                                    <button onClick={() => setActiveCard(null)}
                                        style={{width:'100%',padding:'1rem',background:'linear-gradient(90deg,#f59e0b,#fbbf24)',border:'none',borderRadius:'0.75rem',color:'#0b0f1a',fontFamily:'Rajdhani,sans-serif',fontWeight:700,fontSize:'clamp(1.1rem,1.8vw,1.5rem)',textTransform:'uppercase',letterSpacing:'0.15em',cursor:'pointer'}}>
                                        Keep Playing →
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Board intro — names the concept BEFORE the class plays it.
                           Each board teaches one idea; without this the title only
                           ever appeared in small type in the header, so the boards
                           played as a random pile of cards. ── */}
                    {showBoardIntro && currentBoard && (
                        <div style={{position:'fixed',top:overlayTop,left:0,right:0,bottom:0,zIndex:65,background:'rgba(2,6,23,0.98)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1.25rem',padding:'2rem',textAlign:'center'}}>
                            <div style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.22em',color:'#64748b',fontSize:'clamp(0.85rem,1.6vw,1.1rem)'}}>
                                Board {boardIdx + 1} of {boards.length}
                            </div>
                            <div style={{display:'flex',gap:'0.75rem',fontSize:'clamp(2.5rem,7vw,4.5rem)',lineHeight:1}}>
                                {pairsData.map(p => <span key={p.id}>{p.icon}</span>)}
                            </div>
                            <h2 style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#fde68a',fontSize:'clamp(2rem,5.5vw,4rem)',margin:0,lineHeight:1.15,maxWidth:'18ch'}}>
                                {currentBoard.title}
                            </h2>
                            {currentBoard.takeaway && (
                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:600,color:'#cbd5e1',fontSize:'clamp(1.2rem,2.6vw,2rem)',margin:0,maxWidth:'26ch',lineHeight:1.3}}>
                                    {currentBoard.takeaway}
                                </p>
                            )}
                            <button onClick={() => setShowBoardIntro(false)}
                                style={{marginTop:'0.5rem',padding:'1rem 3rem',background:'linear-gradient(90deg,#f59e0b,#fbbf24)',border:'none',borderRadius:'0.75rem',color:'#0b0f1a',fontFamily:'Rajdhani,sans-serif',fontWeight:700,fontSize:'clamp(1.1rem,2vw,1.5rem)',textTransform:'uppercase',letterSpacing:'0.15em',cursor:'pointer'}}>
                                Let's find them →
                            </button>
                        </div>
                    )}

                    {/* ── Wiggle Break — fires BETWEEN boards, never mid-board:
                           shuffling mid-board would destroy the spatial memory the
                           class just built, which is the whole skill in play. ── */}
                    {showBreak && (
                        <div style={{position:'fixed',top:overlayTop,left:0,right:0,bottom:0,zIndex:60,background:'rgba(2,6,23,0.98)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1.5rem',padding:'2rem',textAlign:'center'}}>
                            <div style={{fontSize:'clamp(4rem,12vw,9rem)',lineHeight:1}}>🙌</div>
                            <div style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.2em',color:'#34d399',fontSize:'clamp(1rem,2vw,1.4rem)'}}>
                                Board {boardIdx + 1} complete!
                            </div>
                            {boards[boardIdx]?.takeaway && (
                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#f1f5f9',fontSize:'clamp(1.4rem,3vw,2.4rem)',margin:0,maxWidth:'22ch',lineHeight:1.3}}>
                                    {boards[boardIdx].takeaway}
                                </p>
                            )}
                            <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#fbbf24',fontSize:'clamp(1.6rem,3.6vw,2.8rem)',margin:0,maxWidth:'20ch',lineHeight:1.25}}>
                                {WIGGLE_PROMPTS[boardIdx % WIGGLE_PROMPTS.length]}
                            </p>
                            <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',justifyContent:'center'}}>
                                <button onClick={advanceBoard}
                                    style={{padding:'1rem 2.5rem',background:'linear-gradient(90deg,#059669,#34d399)',border:'none',borderRadius:'0.75rem',color:'#04140d',fontFamily:'Rajdhani,sans-serif',fontWeight:700,fontSize:'clamp(1.1rem,2vw,1.5rem)',textTransform:'uppercase',letterSpacing:'0.15em',cursor:'pointer'}}>
                                    Next board →
                                </button>
                                {/* Every board boundary is a safe exit for a class that's out of time. */}
                                <button onClick={() => { setShowBreak(false); setGameState('won'); }}
                                    style={{padding:'1rem 1.75rem',background:'transparent',border:'1px solid #475569',borderRadius:'0.75rem',color:'#94a3b8',fontFamily:'Rajdhani,sans-serif',fontWeight:700,fontSize:'clamp(0.9rem,1.5vw,1.1rem)',textTransform:'uppercase',letterSpacing:'0.1em',cursor:'pointer'}}>
                                    Finish here
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Match modal — sibling of scaled stage so it is never scaled */}
                    {activeCard && !isPrimary && (
                        <div style={{position:'fixed',inset:0,zIndex:50,background:'rgba(2,6,23,0.97)',display:'flex',alignItems:'stretch',justifyContent:'center',padding:'0.5rem'}}>
                            <div style={{width:'100%',maxWidth:'1800px',display:'flex',flexDirection:'column',border:'2px solid #f97316',borderRadius:'1rem',background:'#0b0f1a',overflow:'hidden',boxShadow:'0 0 60px rgba(249,115,22,0.25)'}}>

                                {/* ── Top bar: title + X ── */}
                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.75rem 1.5rem',background:'rgba(0,0,0,0.35)',borderBottom:'1px solid rgba(249,115,22,0.2)',flexShrink:0}}>
                                    <div className="font-black text-orange-400" style={{fontFamily:'Rajdhani,sans-serif',fontSize:'clamp(1.4rem,2.8vw,2.2rem)',letterSpacing:'0.02em'}}>{activeCard.iconLabel}</div>
                                    <button onClick={() => setActiveCard(null)}
                                        style={{background:'rgba(249,115,22,0.15)',border:'2px solid rgba(249,115,22,0.5)',borderRadius:'9999px',color:'#fb923c',width:'2.4rem',height:'2.4rem',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',cursor:'pointer',fontWeight:900}}>✕</button>
                                </div>

                                {/* ── Main split ── */}
                                <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>

                                    {/* Left: big icon in dark box */}
                                    <div style={{width:'40%',display:'flex',alignItems:'center',justifyContent:'center',background:'radial-gradient(ellipse at center,#1c1020,#05040a)',borderRight:'1px solid rgba(249,115,22,0.15)'}}>
                                        <span style={{fontSize:'clamp(6rem,14vw,11rem)',lineHeight:1,filter:'drop-shadow(0 0 50px rgba(249,115,22,0.3))'}}>{activeCard.icon}</span>
                                    </div>

                                    {/* Right: QR pinned top-right, content vertically centered */}
                                    <div style={{flex:1,display:'flex',flexDirection:'column',padding:'1.25rem 1.75rem',overflow:'auto',position:'relative',justifyContent:'center',gap:'0.75rem'}}>

                                        {/* Scene pill — sits directly above scripture ref */}
                                        {activeCard.scene && (
                                            <div style={{flexShrink:0}}>
                                                <div style={{background:'rgba(194,65,12,0.7)',borderRadius:'0.4rem',padding:'0.25rem 0.75rem',display:'inline-block'}}>
                                                    <span style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.6rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:'#fed7aa'}}>Scene: {activeCard.scene}</span>
                                                </div>
                                            </div>
                                        )}

                                        {/* Scripture reference */}
                                        <div style={{fontFamily:'Orbitron,sans-serif',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em',color:'#e2e8f0',fontSize:'clamp(1rem,2vw,1.6rem)',flexShrink:0}}>
                                            {activeCard.cardA.split(' — ')[0]}
                                        </div>

                                        {/* Scripture verse */}
                                        {activeCard.verse && (
                                            <div style={{borderLeft:'3px solid #f97316',paddingLeft:'1rem',flexShrink:0}}>
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontStyle:'italic',color:'#cbd5e1',lineHeight:1.55,fontSize:'clamp(1.05rem,1.9vw,1.45rem)',margin:0}}>{activeCard.verse}</p>
                                            </div>
                                        )}

                                        {/* Christ connection */}
                                        {activeCard.christConnection && (
                                            <div style={{background:'rgba(253,224,71,0.08)',border:'1px solid rgba(253,224,71,0.3)',borderRadius:'0.5rem',padding:'0.65rem 1rem',flexShrink:0}}>
                                                <div style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.6rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:'#facc15',marginBottom:'0.35rem'}}>Christ Connection</div>
                                                <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:600,color:'#fef3c7',lineHeight:1.5,fontSize:'clamp(0.95rem,1.7vw,1.3rem)',margin:0}}>{activeCard.christConnection}</p>
                                            </div>
                                        )}

                                        {/* Class discussion */}
                                        <div style={{background:'rgba(6,182,212,0.07)',border:'1px solid rgba(6,182,212,0.25)',borderRadius:'0.5rem',padding:'0.75rem 1rem',flexShrink:0}}>
                                            <div style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.6rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.15em',color:'#22d3ee',marginBottom:'0.5rem'}}>✦ Class Discussion</div>
                                            <p style={{fontFamily:'Rajdhani,sans-serif',fontWeight:700,color:'#f1f5f9',lineHeight:1.5,fontSize:'clamp(1.1rem,2vw,1.65rem)',margin:0}}>{activeCard.question}</p>
                                        </div>

                                        {/* QR code — below discussion, slightly rotated. On-screen click opens scripture in a new tab so the classroom monitor stays on the game. */}
                                        {activeCard.url && (
                                            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:'0.3rem',flexShrink:0,transform:'rotate(3deg)',transformOrigin:'left center',marginLeft:'0.25rem'}}>
                                                <a href={buildHighlightUrl(activeCard.url, activeCard.cardA)} target="_blank" rel="noopener noreferrer" title="Open scripture in a new tab" style={{display:'block',lineHeight:0}}>
                                                    <canvas id="qr-canvas" style={{borderRadius:'0.4rem',border:'1px solid #374151',cursor:'pointer'}} />
                                                </a>
                                                <span style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.5rem',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.1em'}}>Scan or click to read along</span>
                                            </div>
                                        )}

                                    </div>
                                </div>

                                {/* ── Bottom bar ── */}
                                <div style={{borderTop:'1px solid rgba(249,115,22,0.2)',background:'rgba(0,0,0,0.4)',padding:'0.85rem 1.5rem',display:'flex',alignItems:'center',gap:'1.5rem',flexShrink:0}}>
                                    {canSabotage ? (
                                        <>
                                            <span style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.65rem',color:'#f97316',letterSpacing:'0.1em',textTransform:'uppercase',flexShrink:0}}>
                                                Choice: Close (✕) to take another turn… or
                                            </span>
                                            <button onClick={handleSabotage}
                                                style={{background:'#dc2626',border:'none',borderRadius:'0.5rem',color:'white',fontFamily:'Orbitron,sans-serif',fontWeight:900,fontSize:'clamp(0.75rem,1.1vw,0.95rem)',textTransform:'uppercase',letterSpacing:'0.15em',padding:'0.75rem 2rem',cursor:'pointer',whiteSpace:'nowrap'}}>
                                                💥 Execute Sabotage!
                                            </button>
                                        </>
                                    ) : (
                                        <button onClick={() => setActiveCard(null)}
                                            style={{flex:1,padding:'0.75rem',background:'linear-gradient(90deg,#0891b2,#06b6d4)',border:'none',borderRadius:'0.5rem',color:'black',fontFamily:'Orbitron,sans-serif',fontWeight:900,fontSize:'clamp(0.75rem,1.1vw,0.95rem)',textTransform:'uppercase',letterSpacing:'0.15em',cursor:'pointer'}}>
                                            Continue →
                                        </button>
                                    )}
                                </div>

                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
