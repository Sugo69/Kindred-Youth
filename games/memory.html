    <!-- Firebase for Lesson Library reads — anonymous auth required by Firestore rules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, getDocs, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getAllCfmLessons, getCurrentCfmLesson, getCfmLessonByLessonId, resolveLessonIdFromUrl } from '../src/lib/cfm-schedule.js';

        // Expose the 2026 CFM Old Testament schedule to the Babel-compiled React tree.
        window.__kindredCfmLessons = getAllCfmLessons();
        window.__kindredCurrentCfmLesson = getCurrentCfmLesson();

        // Resolve ?lesson= param so the React component can auto-load content.
        const _lessonIdParam = new URLSearchParams(location.search).get('lesson');
        window.__kindredLessonId = _lessonIdParam || null;
        window.__kindredLessonMeta = _lessonIdParam
            ? (getCfmLessonByLessonId(_lessonIdParam) || null)
            : null;
        window.__kindredCfmLessonByUrl = function(url) {
            if (!url) return null;
            const lessonId = resolveLessonIdFromUrl(url);
            if (!lessonId) return null;
            return (window.__kindredCfmLessons || []).find(l => l.lessonId === lessonId) || null;
        };

        const APP_ID = 'exodus-feud-final-v10';

        // Classroom-scoped path — falls back to global when no ?room= param
        const classroomId = new URLSearchParams(location.search).get('room');
        window.__kindredClassroomId = classroomId;
        window.__kindredBasePath = classroomId
            ? `artifacts/${APP_ID}/public/data/classrooms/${classroomId}`
            : `artifacts/${APP_ID}/public/data`;
        window.__kindredGlobalBasePath = `artifacts/${APP_ID}/public/data`;

        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID,
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);
        const auth = getAuth(fbApp);

        // Wait for Firebase to restore auth state from localStorage before deciding to sign in anonymously.
        // Without authStateReady(), auth.currentUser is null on page load even when a Google session exists,
        // causing signInAnonymously to overwrite it and forcing re-login when returning to the portal.
        const _authReady = auth.authStateReady().then(() => {
            if (!auth.currentUser) return signInAnonymously(auth);
        }).catch(e => console.warn('Anon auth failed:', e));

        // Bridge for the Babel/React tree so it can attach an Authorization
        // header when calling /api/lesson-pipeline. Returns null if the user is
        // anonymous or signed out — caller surfaces a "please sign in" error.
        window.__kindredGetIdToken = async function() {
            await _authReady;
            const u = auth.currentUser;
            if (!u || u.isAnonymous) return null;
            return u.getIdToken();
        };

        window.__kindredApiBase = (location.hostname === 'kindred-youth.org' || location.hostname === 'www.kindred-youth.org')
            ? 'https://api.kindred-youth.org'
            : '';

        // Load lesson library entries that have content for the given audience.
        // Church wifi drops constantly, so this races a timeout — a spinner that
        // never resolves is worse than an empty list with a retry.
        window.loadMemoryLibrary = async function(audience) {
            const withTimeout = (p, ms) => Promise.race([
                p,
                new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms)),
            ]);
            try {
                await withTimeout(_authReady, 12000);
                const snap = await withTimeout(getDocs(collection(db, `${window.__kindredGlobalBasePath}/lessonLibrary`)), 12000);
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return audience === 'primary'
                    ? all.filter(e => e.memoryPrimary?.pairs?.length)
                    : all.filter(e => e.memory?.pairs?.length);
            } catch(e) {
                console.warn('Memory library load failed:', e);
                throw e;
            }
        };

        // Log pipeline/app errors to Firestore for debugging
        window.__kindredLogError = async function(payload) {
            try {
                await _authReady;
                await addDoc(collection(db, `${window.__kindredGlobalBasePath}/errorLog`), {
                    ...payload,
                    classroomId: window.__kindredClassroomId || null,
                    source: 'memory.html',
                    userAgent: navigator.userAgent,
                    createdAt: serverTimestamp(),
                });
            } catch(e) {
                console.warn('errorLog write failed:', e);
            }
        };

        // Load a single library entry's memory content
        window.loadMemoryFromLibrary = async function(lessonId) {
            await _authReady;
            const snap = await getDoc(doc(db, `${window.__kindredGlobalBasePath}/lessonLibrary/${lessonId}`));
            if (!snap.exists()) throw new Error('Library entry not found');
            const data = snap.data();
            if (!data.memory?.pairs?.length) throw new Error('No memory content in this library entry');
            return data.memory;
        };

        // ── Primary mode ─────────────────────────────────────────────────────
        // Library doc ids are stored with a `cfm-` prefix but the portal passes
        // the bare lessonId, so every lookup tries both spellings (CLAUDE.md).
        async function _getLessonDoc(lessonId) {
            await _authReady;
            const ids = lessonId.startsWith('cfm-')
                ? [lessonId, lessonId.slice(4)]
                : [lessonId, `cfm-${lessonId}`];
            for (const id of ids) {
                const snap = await getDoc(doc(db, `${window.__kindredGlobalBasePath}/lessonLibrary/${id}`));
                if (snap.exists()) return snap.data();
            }
            return null;
        }

        window.loadMemoryPrimaryFromLibrary = async function(lessonId) {
            const data = await _getLessonDoc(lessonId);
            if (!data) throw new Error('Library entry not found');
            if (!data.memoryPrimary?.pairs?.length) {
                const err = new Error('No Primary content for this lesson');
                err.code = 'NO_PRIMARY';
                err.hasYouth = !!data.memory?.pairs?.length;
                throw err;
            }
            return data.memoryPrimary;
        };

        // Which version of the game does this room get?
        //   ?mode=  →  classroom.audience  →  localStorage  →  null (ask)
        // The classroom field is the one that matters: a Primary teacher should
        // never have to pick, and localStorage dies on a shared building laptop.
        window.__kindredAudienceReady = (async function resolveAudience() {
            const urlMode = new URLSearchParams(location.search).get('mode');
            if (urlMode === 'primary' || urlMode === 'youth') return urlMode;

            if (classroomId) {
                try {
                    await _authReady;
                    const snap = await getDoc(doc(db, `${window.__kindredGlobalBasePath}/classrooms/${classroomId}`));
                    const a = snap.exists() ? snap.data().audience : null;
                    if (a === 'primary' || a === 'youth') return a;
                } catch (e) { console.warn('Classroom audience lookup failed:', e); }
            }

            try {
                const saved = localStorage.getItem('kindred_audience');
                if (saved === 'primary' || saved === 'youth') return saved;
            } catch {}

            return null;
        })();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DEFAULT PAIRS (Exodus lesson — used as fallback) ---
        const DEFAULT_PAIRS = [
            { id:'d1', cardA:'Exodus 14:13-14 — Stand Still', cardB:'The Lord will fight for you', scene:'The Shores of the Red Sea', verse:'"Fear ye not, stand still, and see the salvation of the Lord… The Lord shall fight for you, and ye shall hold your peace."', question:'What does it mean to stand still and trust God during a hard trial?', christConnection:'Christ fights our battles when we trust Him.', icon:'🌊', iconLabel:'Red Sea', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14' },
            { id:'d2', cardA:'Exodus 14:21 — Parting the Sea', cardB:'God can prepare a way all night', scene:'The Shores of the Red Sea', verse:'"And Moses stretched out his hand over the sea; and the Lord caused the sea to go back by a strong east wind all that night, and made the sea dry land, and the waters were divided."', question:'How does God prepare the way for us over time — not always instantly?', christConnection:'Christ opens paths through our impossible barriers.', icon:'💨', iconLabel:'Parting the Sea', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14' },
            { id:'d3', cardA:'Exodus 16:4 — Manna', cardB:'Gather spiritual nourishment daily', scene:'The Wilderness of Sin', verse:'"Then said the Lord unto Moses, Behold, I will rain bread from heaven for you; and the people shall go out and gather a certain rate every day."', question:'How is reading scriptures every day like gathering Manna?', christConnection:'Christ is the Bread of Life — daily nourishment from Him.', icon:'🍞', iconLabel:'Daily Bread', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16' },
            { id:'d4', cardA:'Exodus 17:6 — Water from Rock', cardB:'Christ is the Rock of Living Water', scene:'Horeb — The Mountain of God', verse:'"Behold, I will stand before thee there upon the rock in Horeb; and thou shalt smite the rock, and there shall come water out of it, that the people may drink."', question:'When do you feel spiritually thirsty, and where do you go?', christConnection:'Jesus is the source of living water (John 4:14).', icon:'🪨', iconLabel:'The Rock', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17' },
            { id:'d5', cardA:'Exodus 17:11 — Sustaining Moses', cardB:'We support each other in the fight', scene:'The Battle with Amalek', verse:'"And it came to pass, when Moses held up his hand, that Israel prevailed: and when he let down his hand, Amalek prevailed… Aaron and Hur stayed up his hands."', question:'How can we "hold up the arms" of our leaders and friends today?', christConnection:'Christ strengthens us as we serve together.', icon:'🙌', iconLabel:'Sustain', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/17' },
            { id:'d6', cardA:'Exodus 12:13 — Passover Blood', cardB:'The Atonement of Jesus Christ', scene:'Egypt — Night of the Passover', verse:'"And the blood shall be to you for a token upon the houses where ye are: and when I see the blood, I will pass over you, and the plague shall not be upon you."', question:'What does the blood of the lamb teach us about the Savior?', christConnection:"The Passover lamb is a type of Jesus Christ's sacrifice.", icon:'🩸', iconLabel:'Passover', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12' },
            { id:'d7', cardA:'Exodus 20:3 — No Other Gods', cardB:'Golden calves of today', scene:'The Camp of Israel — Mount Sinai', verse:'"Thou shalt have no other gods before me."', question:'What are "golden calves" — distractions — that compete for your devotion?', christConnection:'God calls us to love Him with all our heart.', icon:'🐄', iconLabel:'Golden Calf', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20' },
            { id:'d8', cardA:'Exodus 3:2 — Burning Bush', cardB:'God speaks through sacred moments', scene:'The Wilderness of Midian', verse:'"And the angel of the Lord appeared unto him in a flame of fire out of the midst of a bush… and, behold, the bush burned with fire, and the bush was not consumed."', question:'What is something holy in your life you need to pay more attention to?', christConnection:'Christ calls us to holy ground — sacred, attentive moments with Him.', icon:'🌳', iconLabel:'Holy Ground', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3' },
            { id:'d9', cardA:'Numbers 21:8 — Brazen Serpent', cardB:'Look to Christ and live', scene:'The Wilderness — A Plague of Serpents', verse:'"And the Lord said unto Moses, Make thee a fiery serpent, and set it upon a pole: and it shall come to pass, that every one that is bitten, when he looketh upon it, shall live."', question:'Why is it sometimes hard to simply look to Christ when we are hurting?', christConnection:'Jesus said: as Moses lifted the serpent, so must the Son of Man be lifted up (John 3:14).', icon:'🐍', iconLabel:'Look & Live', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21' },
            { id:'d10', cardA:"Numbers 13:30 — Caleb's Faith", cardB:'Ten saw giants; two saw miracles', scene:'Kadesh-barnea — The Border of Canaan', verse:'"And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it."', question:'How can we choose to see our challenges through eyes of faith?', christConnection:'Faith in Christ changes what we see as possible.', icon:'🍇', iconLabel:'The Spies', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13' },
            { id:'d11', cardA:'Exodus 25:8 — The Tabernacle', cardB:'God dwells with His people', scene:'The Camp of Israel', verse:'"And let them make me a sanctuary; that I may dwell among them."', question:'Why do we build temples today? How do you feel on temple grounds?', christConnection:'Temples are the house of the Lord — where we meet Christ.', icon:'⛺', iconLabel:'Tabernacle', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25' },
            { id:'d12', cardA:'Exodus 34:29 — Shining Face', cardB:'Time with God transforms us', scene:'Mount Sinai', verse:'"And it came to pass… that Moses wist not that the skin of his face shone while he talked with him."', question:'How does spending time with God change who we are?', christConnection:'We become more like Christ the more time we spend with Him.', icon:'🌟', iconLabel:'Shining Face', url:'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34' },
        ];

        // Audio helpers
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                if (type === 'flip') { osc.frequency.value = 880; gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15); }
                else if (type === 'match') { [523,659,784].forEach((f,i) => { const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0,ctx.currentTime+i*0.1); g.gain.linearRampToValueAtTime(0.2,ctx.currentTime+i*0.1+0.05); g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.1+0.25); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.3); }); return; }
                else if (type === 'mismatch') { osc.type='sawtooth'; osc.frequency.value=120; gain.gain.setValueAtTime(0.3,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3); }
                else if (type === 'win') { [523,659,784,1046,1318].forEach((f,i)=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0,ctx.currentTime+i*0.1); g.gain.linearRampToValueAtTime(0.2,ctx.currentTime+i*0.1+0.05); g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.1+0.4); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.5); }); return; }
                else if (type === 'sabotage') { osc.type='sawtooth'; osc.frequency.setValueAtTime(400,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.8); gain.gain.setValueAtTime(0.4,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8); }
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.5);
            } catch(e) {}
        };

        function App() {
            const [gameState, setGameState] = useState('portal'); // portal | rules | playing | won
            const [pairsData, setPairsData] = useState(DEFAULT_PAIRS);
            const [lessonTopic, setLessonTopic] = useState('Exodus & Numbers — Wilderness Journey');
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [isChecking, setIsChecking] = useState(false);
            const [mismatchIdx, setMismatchIdx] = useState([]);
            const [activeCard, setActiveCard] = useState(null);
            const [isSabotaging, setIsSabotaging] = useState(false);
            const [scale, setScale] = useState(100);
            const [showAdmin, setShowAdmin] = useState(false);
            const [sabotageEvery, setSabotageEvery] = useState(3);

            // Teacher Portal state
            const [portalView, setPortalView] = useState('home'); // home | lesson | manual
            const [lessonUrl, setLessonUrl] = useState('');
            const [portalStatus, setPortalStatus] = useState('');
            const [portalLoading, setPortalLoading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [manualPairs, setManualPairs] = useState([]);
            const [generatedFromUrl, setGeneratedFromUrl] = useState('');
            const [generatedAt, setGeneratedAt] = useState(null);
            const [generatedMedia, setGeneratedMedia] = useState({ videoLinks: [], talkLinks: [] });
            const [showSettings, setShowSettings] = useState(false);
            const retryTimerRef = useRef(null);
            const youthLoadedRef = useRef(false);
            const playHeaderRef = useRef(null);
            const [playHeaderH, setPlayHeaderH] = useState(40);
            const attemptCountRef = useRef(0);
            const progressTimerRef = useRef(null);
            const [libraryEntries, setLibraryEntries] = useState([]);
            const [libraryLoading, setLibraryLoading] = useState(false);
            const [libraryError, setLibraryError] = useState('');
            const [showArchive, setShowArchive] = useState(false);

            // ── Primary mode (ages ~4–11) ──
            // Same 12 pairs as Youth mode, chunked into 3 short boards with a
            // movement break between them. See scripture-match-primary-design.md.
            const [audience, setAudience] = useState(null);       // 'primary' | 'youth' | null = ask
            const [audienceReady, setAudienceReady] = useState(false);
            const [primaryData, setPrimaryData] = useState(null); // { boards[], pairs[] }
            const [boardIdx, setBoardIdx] = useState(0);
            const [showBreak, setShowBreak] = useState(false);
            const [showBoardIntro, setShowBoardIntro] = useState(false);
            const [primaryMissing, setPrimaryMissing] = useState(false);
            const isPrimary = audience === 'primary';
            const boards = primaryData?.boards || [];
            const currentBoard = boards[boardIdx] || null;

            // A stand-up beat between boards. Hand-written client-side bank —
            // no API cost, no compliance surface.
            const WIGGLE_PROMPTS = [
                'Stand up and reach to heaven! 🙌',
                'March in place while we count to ten! 🚶',
                'Give the person next to you a high five! ✋',
                'Stretch up tall, then touch your toes! 🤸',
                'Clap three times and sit down softly! 👏',
            ];

            // Apply saved scale
            useEffect(() => {
                const saved = localStorage.getItem('kindred_display_scale');
                if (saved && !isNaN(parseFloat(saved))) setScale(parseFloat(saved) * 100);
            }, []);

            // Resolve which version of the game this room gets (see the module
            // script): ?mode= → classroom.audience → localStorage → ask.
            useEffect(() => {
                let cancelled = false;
                Promise.resolve(window.__kindredAudienceReady).then(a => {
                    if (cancelled) return;
                    setAudience(a || null);
                    setAudienceReady(true);
                }).catch(() => { if (!cancelled) setAudienceReady(true); });
                return () => { cancelled = true; };
            }, []);

            // Primary content load. Runs once the audience is known to be
            // 'primary' — a different Firestore field from Youth mode, so this
            // is a content swap, not a re-skin.
            useEffect(() => {
                if (!isPrimary) return;
                const lessonId = window.__kindredLessonId;
                if (!lessonId || !window.loadMemoryPrimaryFromLibrary) return;
                let cancelled = false;
                window.loadMemoryPrimaryFromLibrary(lessonId).then(data => {
                    if (cancelled) return;
                    if (retryTimerRef.current) { clearInterval(retryTimerRef.current); retryTimerRef.current = null; }
                    setPrimaryData(data);
                    setPrimaryMissing(false);
                    setBoardIdx(0);
                    setPairsData(data.pairs.filter(p => p.board === 1));
                    setLessonTopic(data.topic || 'Primary Lesson');
                    setGeneratedAt(data.generatedAt ? new Date(data.generatedAt) : new Date());
                    setPortalStatus(`✓ Primary version loaded — ${data.boards.length} boards, ${data.pairs.length} cards.`);
                }).catch(err => {
                    if (cancelled) return;
                    // Never dead-end: say what's missing and leave the Youth
                    // version reachable from the picker.
                    setPrimaryMissing(true);
                    setPortalStatus(err.code === 'NO_PRIMARY'
                        ? '⚠ No younger-kids version for this lesson yet — an admin needs to generate it.'
                        : '⚠ Could not load the younger-kids version.');
                });
                return () => { cancelled = true; };
            }, [isPrimary]);

            // Auto-load from library when ?lesson= param is set.
            // If the lesson is pre-generated → load pairs immediately.
            // If not yet generated → pre-fill the lesson URL so teacher can click Generate.
            useEffect(() => {
                const lessonId = window.__kindredLessonId;
                if (!lessonId || !window.loadMemoryFromLibrary) return;
                if (!audienceReady || audience === 'primary') return;  // Primary has its own loader above
                if (youthLoadedRef.current) return;
                youthLoadedRef.current = true;
                window.loadMemoryFromLibrary(lessonId).then(memData => {
                    if (retryTimerRef.current) { clearInterval(retryTimerRef.current); retryTimerRef.current = null; }
                    setPairsData(memData.pairs);
                    setLessonTopic(memData.topic || 'Library Lesson');
                    setGeneratedFromUrl(memData.sourceUrl || '');
                    setGeneratedAt(memData.generatedAt ? new Date(memData.generatedAt) : new Date());
                    setGeneratedMedia({ videoLinks: memData.videoLinks || [], talkLinks: memData.talkLinks || [] });
                    setPortalStatus(`✓ Loaded from library — ${memData.pairs.length} pairs. Ready to play!`);
                }).catch(() => {
                    const meta = window.__kindredLessonMeta;
                    if (meta?.url) {
                        setLessonUrl(meta.url);
                        setPortalView('lesson');
                        setPortalStatus('📚 Lesson not pre-generated yet — click Generate to create it');
                    }
                });
            }, [audienceReady, audience]);

            // Build a Gospel-Library URL with the blue verse-highlight bar.
            // Matches "Book Chapter:start" or "Book Chapter:start–end" anywhere in the scripture reference.
            // Whole-chapter refs (no colon) fall back to the raw URL (no highlight, no anchor).
            const buildHighlightUrl = (rawUrl, scriptureRef) => {
                if (!rawUrl) return rawUrl;
                const ref = (scriptureRef || '').trim();
                const m = ref.match(/:(\d+)(?:\s*[\u2013\u2014\u2010\u2011\u2212\-]\s*(\d+))?(?!\d)/);
                if (!m) return rawUrl;
                const start = parseInt(m[1], 10);
                const end = m[2] ? parseInt(m[2], 10) : start;
                const idParam = end > start ? `${start}-${end}` : `${start}`;
                try {
                    const u = new URL(rawUrl);
                    u.searchParams.set('id', idParam);
                    u.hash = `p${start}`;
                    return u.toString();
                } catch { return rawUrl; }
            };

            // Every Story Card opens at the top — the scripture is the point, and
            // the QR at the bottom must never be what the class sees first.
            useEffect(() => {
                if (!activeCard) return;
                const el = document.getElementById('story-scroll');
                if (el) el.scrollTop = 0;
            }, [activeCard]);

            // QR code — uses the highlight URL so the scanned page lights up the verse.
            useEffect(() => {
                if (activeCard?.url) {
                    setTimeout(() => {
                        const el = document.getElementById('qr-canvas');
                        const href = buildHighlightUrl(activeCard.url, activeCard.verseRef || activeCard.cardA);
                        if (el && window.QRious) new window.QRious({ element: el, value: href, size: 140, background: 'white', foreground: '#0a0a20' });
                    }, 60);
                }
            }, [activeCard]);

            // Win detection. In Primary mode a finished board is not the end of
            // the game — it's a Wiggle Break and then the next board. Every
            // board boundary is also a safe exit for a teacher who's out of time.
            useEffect(() => {
                if (cards.length > 0 && matched.length === cards.length / 2 && !activeCard) {
                    if (isPrimary && boardIdx < boards.length - 1) setShowBreak(true);
                    else setGameState('won');
                }
            }, [matched, cards.length, activeCard, isPrimary, boardIdx, boards.length]);

            // The Story Card and the Wiggle Break sit BELOW the play header so the
            // ⚙ gear and the progress strip stay reachable while a card is open.
            // Measured rather than hardcoded — the header grows when the progress
            // strip wraps on a narrow tablet.
            useEffect(() => {
                if (gameState !== 'playing') return;
                const measure = () => setPlayHeaderH(playHeaderRef.current?.offsetHeight || 40);
                measure();
                window.addEventListener('resize', measure);
                window.addEventListener('orientationchange', measure);
                return () => {
                    window.removeEventListener('resize', measure);
                    window.removeEventListener('orientationchange', measure);
                };
            }, [gameState, showAdmin, isPrimary, boardIdx, matched.length]);

            // 34px is the fixed Kindred back-nav above the play area.
            const overlayTop = `${34 + playHeaderH}px`;

            // Move to the next board after the break.
            const advanceBoard = () => {
                const next = boardIdx + 1;
                const nextPairs = (primaryData?.pairs || []).filter(p => p.board === next + 1);
                setShowBreak(false);
                setBoardIdx(next);
                setPairsData(nextPairs);
                initGame(nextPairs);
                setShowBoardIntro(true);
            };

            // Start Primary play from board 1 (used by the Play button).
            const startPrimaryGame = () => {
                const first = (primaryData?.pairs || []).filter(p => p.board === 1);
                setBoardIdx(0);
                setShowBreak(false);
                setPairsData(first);
                initGame(first);
                setGameState('playing');
                setShowBoardIntro(true);
            };

            // Pick / switch the audience. Persists per device; the classroom
            // field still wins on the next fresh load elsewhere.
            const chooseAudience = (next) => {
                try { localStorage.setItem('kindred_audience', next); } catch {}
                const u = new URL(location.href);
                u.searchParams.set('mode', next);
                history.replaceState(null, '', u.toString());
                setAudience(next);
                setPrimaryMissing(false);
                setBoardIdx(0);
                setShowBreak(false);
                setShowBoardIntro(false);
                setCards([]); setFlipped([]); setMatched([]); setActiveCard(null);
                if (next === 'youth') { youthLoadedRef.current = false; setPairsData(DEFAULT_PAIRS); }
                setGameState('portal');
            };

            const initGame = (pairs) => {
                const gamePairs = pairs || pairsData;
                let deck = [];
                gamePairs.forEach(p => {
                    deck.push({ ...p, uniqueId: `${p.id}-A`, face: 'A', pairId: p.id });
                    deck.push({ ...p, uniqueId: `${p.id}-B`, face: 'B', pairId: p.id });
                });
                deck = deck.sort(() => Math.random() - 0.5);
                setCards(deck); setFlipped([]); setMatched([]); setActiveCard(null);
            };

            const startGame = () => {
                if (portalLoading) return;
                initGame(); setGameState('rules');
            };

            const handleCardClick = (idx) => {
                if (isChecking || flipped.includes(idx)) return;
                // Already-matched cards re-open their modal so the class can revisit the discussion.
                if (matched.includes(cards[idx].pairId)) {
                    setActiveCard(cards[idx]);
                    return;
                }
                if (flipped.length === 0) playSound('flip');
                const newFlipped = [...flipped, idx];
                setFlipped(newFlipped);
                if (newFlipped.length === 2) {
                    setIsChecking(true);
                    const c1 = cards[newFlipped[0]], c2 = cards[newFlipped[1]];
                    if (c1.pairId === c2.pairId) {
                        const isFinal = matched.length + 1 === cards.length / 2;
                        playSound(isFinal ? 'win' : 'match');
                        setTimeout(() => {
                            setMatched(prev => [...prev, c1.pairId]);
                            setFlipped([]); setIsChecking(false); setActiveCard(c1);
                        }, 500);
                    } else {
                        playSound('mismatch');
                        setMismatchIdx(newFlipped);
                        setTimeout(() => { setFlipped([]); setMismatchIdx([]); setIsChecking(false); }, isPrimary ? 1400 : 900);
                    }
                }
            };

            const handleSabotage = () => {
                playSound('sabotage'); setIsSabotaging(true); setActiveCard(null);
                setTimeout(() => { setCards(prev => [...prev].sort(() => Math.random() - 0.5)); setIsSabotaging(false); }, 1500);
            };

            const canSabotage = !isPrimary && activeCard && matched.length > 0 && matched.length % sabotageEvery === 0 && matched.length < cards.length / 2;
            const cols = pairsData.length <= 8 ? 4 : pairsData.length <= 12 ? 6 : 6;

            // Load library when switching to the library view
            useEffect(() => {
                if (portalView === 'library' && window.loadMemoryLibrary) {
                    let cancelled = false;
                    setLibraryLoading(true);
                    setLibraryError('');
                    window.loadMemoryLibrary(audience).then(entries => {
                        if (cancelled) return;
                        setLibraryEntries(entries);
                        setLibraryLoading(false);
                    }).catch(err => {
                        // Always land somewhere the teacher can act on.
                        if (cancelled) return;
                        setLibraryEntries([]);
                        setLibraryLoading(false);
                        setLibraryError(err?.message === 'timeout'
                            ? 'The library did not respond — check the connection and try again.'
                            : 'Could not load the library.');
                    });
                    return () => { cancelled = true; };
                }
            }, [portalView, audience]);

            const loadFromLibrary = async (entry) => {
                // Cancel any pending retry timer so it can't overwrite library-loaded pairs
                if (retryTimerRef.current) { clearInterval(retryTimerRef.current); retryTimerRef.current = null; }
                try {
                    setPortalLoading(true);
                    setPortalStatus('Loading from library…');
                    if (isPrimary) {
                        const data = await window.loadMemoryPrimaryFromLibrary(entry.id);
                        clearInterval(progressTimerRef.current);
                        setPrimaryData(data);
                        setPrimaryMissing(false);
                        setBoardIdx(0);
                        setPairsData(data.pairs.filter(p => p.board === 1));
                        setLessonTopic(data.topic || entry.name || 'Primary Lesson');
                        setGeneratedFromUrl(entry.url || '');
                        setGeneratedAt(data.generatedAt ? new Date(data.generatedAt) : new Date());
                        setPortalLoading(false);
                        setPortalStatus(`✓ Loaded "${data.topic || entry.name}" — ${data.boards.length} boards, ${data.pairs.length} cards.`);
                        setPortalView('home');
                        return;
                    }
                    const memData = await window.loadMemoryFromLibrary(entry.id);
                    clearInterval(progressTimerRef.current);
                    setPairsData(memData.pairs);
                    setLessonTopic(memData.topic || entry.name || 'Library Lesson');
                    setGeneratedFromUrl(memData.sourceUrl || entry.url || '');
                    setGeneratedAt(memData.generatedAt ? new Date(memData.generatedAt) : new Date());
                    setGeneratedMedia({ videoLinks: memData.videoLinks || [], talkLinks: memData.talkLinks || [] });
                    setPortalLoading(false);
                    setPortalStatus(`✓ Loaded "${memData.topic || 'lesson'}" from library — ${memData.pairs.length} pairs. Ready to play!`);
                    setPortalView('home');
                } catch(err) {
                    setPortalStatus(`⚠ ${err.message}`);
                    setPortalLoading(false);
                }
            };

            // Teacher Portal — generate from lesson URL
            const generateFromLesson = async (isAutoRetry = false) => {
                if (retryTimerRef.current) { clearInterval(retryTimerRef.current); retryTimerRef.current = null; }
                if (!lessonUrl.trim()) { setPortalStatus('Please enter a lesson URL.'); return; }
                if (!isAutoRetry) attemptCountRef.current = 0;
                attemptCountRef.current += 1;
                setPortalLoading(true);
                setPortalStatus(`Running lesson pipeline… (attempt ${attemptCountRef.current}/2)`);
                setProgress(0);
                // Animate progress: ease toward 90% over ~40s, never reaching 100 until done
                let pct = 0;
                if (progressTimerRef.current) clearInterval(progressTimerRef.current);
                progressTimerRef.current = setInterval(() => {
                    pct += (90 - pct) * 0.035;
                    setProgress(Math.min(pct, 89));
                }, 500);
                try {
                    const token = await window.__kindredGetIdToken?.();
                    if (!token) throw new Error('Please sign in via the Kindred Hub before generating.');
                    const resp = await fetch(`${window.__kindredApiBase}/api/lesson-pipeline`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify({ url: lessonUrl, gameType: 'memory' })
                    });
                    const data = await resp.json();
                    if (!resp.ok) {
                        const e = new Error(data.error || 'Pipeline failed');
                        e.step = data.step; e.debugExcerpt = data.debugExcerpt; e.httpStatus = resp.status;
                        throw e;
                    }
                    if (!data.pairs?.length) throw new Error('No pairs returned');
                    clearInterval(progressTimerRef.current);
                    setProgress(100);
                    setPairsData(data.pairs);
                    setLessonTopic(data.topic || 'Custom Lesson');
                    setPortalStatus(`✓ Generated ${data.pairs.length} matching pairs. Ready to play!`);
                    setGeneratedFromUrl(lessonUrl);
                    setGeneratedAt(new Date());
                    setGeneratedMedia({ videoLinks: data.videoLinks || [], talkLinks: data.talkLinks || [] });
                    setPortalLoading(false);
                    attemptCountRef.current = 0;
                } catch(err) {
                    clearInterval(progressTimerRef.current);
                    setProgress(0);
                    setPortalLoading(false);
                    console.error('[generateFromLesson] attempt', attemptCountRef.current, 'failed:', err);
                    if (window.__kindredLogError) {
                        window.__kindredLogError({
                            context: 'memory.generateFromLesson',
                            attempt: attemptCountRef.current,
                            lessonUrl,
                            errorMessage: err.message,
                            step: err.step || null,
                            httpStatus: err.httpStatus || null,
                            debugExcerpt: err.debugExcerpt || null,
                        });
                    }
                    if (attemptCountRef.current >= 2) {
                        setPortalStatus(`⚠ Generation failed twice: ${err.message}. Error logged — share with Kindred support. Click Generate to try again.`);
                        attemptCountRef.current = 0;
                        return;
                    }
                    let secs = 30;
                    setPortalStatus(`⚠ ${err.message} — retrying in ${secs}s (attempt ${attemptCountRef.current + 1}/2) or click Generate again`);
                    retryTimerRef.current = setInterval(() => {
                        secs--;
                        if (secs <= 0) {
                            clearInterval(retryTimerRef.current); retryTimerRef.current = null;
                            generateFromLesson(true);
                        } else {
                            setPortalStatus(`⚠ ${err.message} — retrying in ${secs}s (attempt ${attemptCountRef.current + 1}/2) or click Generate again`);
                        }
                    }, 1000);
                }
            };

            // Content moderation before committing manual pairs
            const CLIENT_BLOCK_TERMS_MEM = [/\bsh[i!1]t\b/i,/\bf+u+c+k+(?:ing|er|ed|s)?\b/i,/\bcunt\b/i,/\basshole\b/i,/\bbullsh[i!1]t\b/i,/\bm[o0]th[e3]rfuck/i,/\bbitch(?:es)?\b/i,/\bc[o0]ck\b(?!atrice|roach)/i,/\bpussy\b(?!\s*willow)/i,/\bmeth(?:amphetamine)?\b/i];
            const handleSavePairs = async () => {
                setPortalLoading(true); setPortalStatus('Checking content…');
                const allText = manualPairs.map(p => `${p.cardA||''} ${p.cardB||''} ${p.question||''}`).join(' ');
                const hit = CLIENT_BLOCK_TERMS_MEM.find(r => r.test(allText));
                if (hit) { setPortalStatus('⚠ Content blocked — flagged word found. Please revise before saving.'); setPortalLoading(false); return; }
                setPortalStatus('Moderating…');
                try {
                    const rounds = manualPairs.map((p, i) => ({ n: i + 1, question: p.question || '', answers: [p.cardA || '', p.cardB || ''] }));
                    const apiBase = window.__kindredApiBase || '';
                    const res = await fetch(`${apiBase}/api/moderate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rounds }) });
                    if (res.ok) {
                        const data = await res.json();
                        const flagged = (data.results || []).filter(r => r.verdict === 'FLAG');
                        if (flagged.length) { setPortalStatus(`⚠ Pair ${flagged[0].i + 1} flagged: ${flagged[0].reason || 'inappropriate content'}. Please revise.`); setPortalLoading(false); return; }
                    }
                } catch(e) { /* fail open */ }
                setPairsData(manualPairs); setPortalView('home'); setPortalLoading(false); setPortalStatus(`✓ ${manualPairs.length} pairs saved.`);
            };

            // --- PORTAL VIEW ---
            if (gameState === 'portal') return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center p-4 md:p-8" style={{ transform: `scale(${scale/100})`, transformOrigin: 'top center' }}>
                    <div className="w-full max-w-3xl">
                        {/* Header with gear */}
                        <div className="relative text-center mb-8 mt-4">
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 drop-shadow-[0_0_30px_rgba(0,242,255,0.5)]">
                                Scripture Match
                            </h1>
                            <p className="text-slate-400 font-bold tracking-widest text-sm uppercase mt-2" style={{fontFamily:'Orbitron,sans-serif'}}>Find the match. Unlock the discussion.</p>
                            {/* Settings gear */}
                            <div style={{position:'absolute',top:0,right:0}}>
                                <button onClick={()=>setShowSettings(s=>!s)}
                                    className="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-600 text-slate-300 hover:text-cyan-400 hover:border-cyan-500 transition-colors text-base">⚙</button>
                                {showSettings && (
                                    <div className="absolute right-0 top-11 bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-2xl z-50 w-64">
                                        <div className="text-xs font-bold tracking-widest text-slate-500 uppercase mb-3" style={{fontFamily:'Orbitron,sans-serif'}}>Display Scale</div>
                                        <div className="flex flex-col gap-2">
                                            {[['📱 Mobile',55],['📟 Tablet',75],['🖥 HD TV',100],['📺 4K',160]].map(([label,val])=>(
                                                <button key={val} onClick={()=>{setScale(val);localStorage.setItem('kindred_display_scale',(val/100).toString());setShowSettings(false);}}
                                                    className={`px-3 py-2 text-xs font-bold uppercase rounded-lg border transition-all text-left ${scale===val?'bg-cyan-500 border-cyan-500 text-black':'border-slate-600 text-slate-400 hover:border-slate-400'}`}
                                                    style={{fontFamily:'Orbitron,sans-serif'}}>{label}</button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Which version is this room playing? */}
                        {audienceReady && (
                            <div className="bg-slate-900 border border-emerald-500/30 rounded-xl p-4 mb-4">
                                <div className="flex items-center justify-between gap-4 flex-wrap">
                                    <div>
                                        <div className="text-xs font-bold tracking-widest text-emerald-500 uppercase mb-1" style={{fontFamily:'Orbitron,sans-serif'}}>Who is playing?</div>
                                        <div className="text-slate-400 text-xs">
                                            {audience === null
                                                ? 'Pick the version that fits your class.'
                                                : isPrimary
                                                    ? 'Primary — short boards, picture cards, simpler scriptures.'
                                                    : 'Youth — full board, scripture references, full verses.'}
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => chooseAudience('primary')}
                                            className={`px-4 py-2 rounded-lg font-bold text-xs tracking-widest uppercase border transition-all ${isPrimary ? 'bg-emerald-500 text-black border-emerald-400' : 'border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/10'}`}
                                            style={{fontFamily:'Orbitron,sans-serif'}}>🧸 Primary</button>
                                        <button onClick={() => chooseAudience('youth')}
                                            className={`px-4 py-2 rounded-lg font-bold text-xs tracking-widest uppercase border transition-all ${audience === 'youth' ? 'bg-cyan-500 text-black border-cyan-400' : 'border-cyan-500/40 text-cyan-400 hover:bg-cyan-500/10'}`}
                                            style={{fontFamily:'Orbitron,sans-serif'}}>🎓 Youth</button>
                                    </div>
                                </div>
                                {isPrimary && primaryMissing && (
                                    <div className="mt-3 text-xs rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-300 px-3 py-2">
                                        No Primary version for this lesson yet — an admin needs to generate it.
                                        You can still play the Youth version with this class.
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Current lesson */}
                        {(() => {
                            const cfmLesson = generatedFromUrl && window.__kindredCfmLessonByUrl
                                ? window.__kindredCfmLessonByUrl(generatedFromUrl) : null;
                            const dateChip = cfmLesson
                                ? `CFM Wk ${cfmLesson.slug} · ${cfmLesson.dateRange}`
                                : (generatedAt ? `Generated ${generatedAt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}` : null);
                            return (
                                <div className="bg-slate-900 border border-cyan-500/30 rounded-xl p-4 mb-6 flex items-center justify-between">
                                    <div>
                                        <div className="text-xs font-bold tracking-widest text-cyan-500 uppercase mb-1" style={{fontFamily:'Orbitron,sans-serif'}}>Active Lesson</div>
                                        <div className="text-white font-bold">{lessonTopic}</div>
                                        <div className="text-slate-500 text-xs mt-1 flex items-center gap-2 flex-wrap">
                                            <span>{isPrimary
                                                ? `${primaryData?.pairs?.length || 0} cards · ${boards.length} short boards`
                                                : `${pairsData.length} matching pairs loaded`}</span>
                                            {dateChip && (
                                                <span className="px-2 py-0.5 rounded-md bg-cyan-500/10 border border-cyan-500/30 text-cyan-300" style={{fontFamily:'Orbitron,sans-serif',fontSize:'0.62rem',letterSpacing:'0.08em'}}>
                                                    {dateChip}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    <button onClick={isPrimary ? startPrimaryGame : startGame} disabled={portalLoading || (isPrimary && !primaryData)}
                                        className="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 disabled:bg-slate-700 disabled:text-slate-400 disabled:hover:bg-slate-700 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:shadow-none text-black font-black text-sm tracking-widest uppercase rounded-lg transition-all hover:scale-105 hover:shadow-[0_0_20px_rgba(0,242,255,0.5)]"
                                        style={{fontFamily:'Orbitron,sans-serif'}}>
                                        {portalLoading ? '⏳ Generating…' : 'Play →'}
                                    </button>
                                </div>
                            );
                        })()}

                        {/* Teacher Portal */}
                        <div className="bg-slate-900 border border-purple-500/30 rounded-xl p-5 mb-4">
                            <div className="flex items-center gap-3 mb-4">
                                <span className="text-2xl">🎓</span>
                                <div>
                                    <div className="text-purple-400 font-black tracking-widest text-sm uppercase" style={{fontFamily:'Orbitron,sans-serif'}}>Teacher Portal</div>
                                    <div className="text-slate-500 text-xs">Load a lesson from churchofjesuschrist.org or build custom pairs</div>
                                </div>
                            </div>

                            {portalView === 'home' && (
                                <div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <button onClick={() => setPortalView('library')}
                                            className="px-4 py-4 border border-amber-500/50 text-amber-400 font-bold text-xs tracking-widest uppercase rounded-lg hover:bg-amber-500/10 transition-all"
                                            style={{fontFamily:'Orbitron,sans-serif'}}>
                                            📚 Library
                                            <div className="text-[10px] text-slate-500 font-normal tracking-normal normal-case mt-1">Pre-generated lessons</div>
                                        </button>
                                        <button onClick={() => setPortalView('lesson')}
                                            className="px-4 py-4 border border-cyan-500/50 text-cyan-400 font-bold text-xs tracking-widest uppercase rounded-lg hover:bg-cyan-500/10 transition-all"
                                            style={{fontFamily:'Orbitron,sans-serif'}}>
                                            🔗 From Lesson URL
                                            <div className="text-[10px] text-slate-500 font-normal tracking-normal normal-case mt-1">Generate from churchofjesuschrist.org</div>
                                        </button>
                                    </div>
                                    {pairsData?.length > 0 && (
                                        <div className="mt-3 flex justify-end">
                                            <button onClick={() => { setPortalView('manual'); setManualPairs(pairsData.map(p => ({...p}))); }}
                                                className="px-3 py-2 border border-purple-500/40 text-purple-400 font-bold text-[10px] tracking-widest uppercase rounded-lg hover:bg-purple-500/10 transition-all"
                                                style={{fontFamily:'Orbitron,sans-serif'}}>
                                                ✏️ Edit current pairs
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {portalView === 'library' && (
                                <div>
                                    <div className="text-xs text-slate-500 mb-3" style={{fontFamily:'Orbitron,sans-serif'}}>Select a pre-generated lesson — loads instantly, no API call</div>
                                    {libraryLoading && (
                                        <div className="text-xs text-amber-400 py-4 text-center" style={{fontFamily:'Orbitron,sans-serif'}}>Loading library…</div>
                                    )}
                                    {!libraryLoading && libraryError && (
                                        <div className="text-center py-6">
                                            <div className="text-2xl mb-2">⚠</div>
                                            <div className="text-amber-400 text-xs" style={{fontFamily:'Orbitron,sans-serif'}}>{libraryError}</div>
                                            <button onClick={() => { setPortalView('home'); setTimeout(() => setPortalView('library'), 30); }}
                                                className="mt-3 px-4 py-2 border border-amber-500/50 text-amber-400 font-bold text-[10px] tracking-widest uppercase rounded-lg hover:bg-amber-500/10"
                                                style={{fontFamily:'Orbitron,sans-serif'}}>↻ Try again</button>
                                        </div>
                                    )}
                                    {!libraryLoading && !libraryError && libraryEntries.length === 0 && (
                                        <div className="text-center py-6">
                                            <div className="text-2xl mb-2">📭</div>
                                            <div className="text-slate-500 text-xs" style={{fontFamily:'Orbitron,sans-serif'}}>
                                                {isPrimary ? 'No Primary lessons in the library yet' : 'No library lessons yet'}
                                            </div>
                                            <div className="text-slate-600 text-xs mt-1">
                                                {isPrimary
                                                    ? 'An admin generates these with ⚡ Primary in the admin Library tab.'
                                                    : 'Ask your admin to generate lessons in the Library tab'}
                                            </div>
                                        </div>
                                    )}
                                    {(() => {
                                        // Auto-archive: hide CFM lessons whose teaching Sunday (weekEnd) is more than 7 days past,
                                        // and custom entries whose generatedAt is more than 7 days past. Anything older drops into the
                                        // collapsible "📦 Archive" section so the active list stays focused on the current week.
                                        const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
                                        const isArchived = (entry) => {
                                            const cfm = window.__kindredCfmLessonByUrl ? window.__kindredCfmLessonByUrl(entry.url) : null;
                                            if (cfm) return new Date(cfm.weekEnd + 'T00:00:00Z').getTime() < cutoff;
